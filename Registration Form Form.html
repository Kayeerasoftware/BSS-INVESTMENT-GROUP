<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Membership Bio Data Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        /* Custom CSS for responsive, concise form */
        body {
            min-width: 320px;
            font-size: 18px; /* Large base for big screens */
        }

        .container {
            max-width: 100%;
            padding: 1rem;
        }

        /* Large text and inputs for big screens */
        input, textarea, button {
            min-height: 2.5rem; /* Tappable inputs */
            font-size: clamp(1rem, 2.5vw, 1.125rem); /* Large input text */
            width: 100%;
            box-sizing: border-box;
        }

        /* Custom grid for side-by-side layout */
        .custom-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.5rem; /* Tight gap */
        }

        /* Flex for dynamic fields */
        .flex-container {
            display: flex;
            flex-wrap: nowrap;
            gap: 0.5rem;
            width: 100%;
        }

        /* Responsive scaling for smaller screens */
        @media (max-width: 640px) {
            body {
                font-size: 14px; /* Smaller base */
            }
            .container {
                padding: 0.5rem; /* Tighter padding */
            }
            input, textarea, button {
                min-height: 2rem; /* Smaller inputs */
                font-size: clamp(0.75rem, 2vw, 0.875rem); /* Smaller text */
                padding: 0.5rem;
            }
            h2 {
                font-size: clamp(1.25rem, 4vw, 1.5rem); /* Smaller h2 */
            }
            h3 {
                font-size: clamp(1rem, 3.5vw, 1.25rem); /* Smaller h3 */
            }
            h4 {
                font-size: clamp(0.875rem, 3vw, 1rem); /* Smaller h4 */
            }
            label {
                font-size: clamp(0.75rem, 2vw, 0.875rem); /* Smaller labels */
            }
            .space-y-4 > * + * {
                margin-top: 0.75rem; /* Tighter spacing */
            }
            .space-y-2 > * + * {
                margin-top: 0.5rem;
            }
            button {
                padding: 0.5rem 1rem;
                font-size: clamp(0.75rem, 2vw, 0.875rem);
            }
        }

        /* Ultra-compact for very small screens */
        @media (max-width: 400px) {
            .custom-grid {
                grid-template-columns: 1fr; /* Stack columns */
            }
            .flex-container {
                flex-direction: column;
                align-items: stretch;
            }
            .flex-container button {
                margin-top: 0.25rem;
            }
            body {
                font-size: 12px; /* Smallest base */
            }
            .container {
                padding: 0.25rem;
            }
            input, textarea, button {
                min-height: 1.75rem; /* Smallest inputs */
                font-size: clamp(0.625rem, 1.8vw, 0.75rem); /* Smallest text */
                padding: 0.25rem;
            }
            h2 {
                font-size: clamp(1rem, 3.5vw, 1.25rem);
            }
            h3 {
                font-size: clamp(0.875rem, 3vw, 1rem);
            }
            h4 {
                font-size: clamp(0.75rem, 2.5vw, 0.875rem);
            }
            label {
                font-size: clamp(0.625rem, 1.8vw, 0.75rem);
            }
            .space-y-4 > * + * {
                margin-top: 0.5rem;
            }
            .space-y-2 > * + * {
                margin-top: 0.25rem;
            }
            button {
                padding: 0.25rem 0.5rem;
                font-size: clamp(0.625rem, 1.8vw, 0.75rem);
            }
        }

        /* Prevent overflow */
        .min-w-0 {
            min-width: 0;
        }

        /* Clean, minimal styling for small screens */
        @media (max-width: 640px) {
            .shadow-md {
                box-shadow: none; /* Remove shadows */
            }
            .rounded-lg {
                border-radius: 0.25rem; /* Smaller corners */
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto">
        <!-- Submit Form -->
        <div class="bg-white p-4 rounded-lg shadow-md mb-4">
            <h2 class="text-3xl font-bold mb-3">Membership Form</h2>
            <form id="bioDataForm" class="space-y-4">
                <!-- 1. Personal Details -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Personal Details</h3>
                    <div class="custom-grid">
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Full Name</label>
                            <input type="text" name="full_name" class="p-1 border rounded" required>
                        </div>
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">NIN No</label>
                            <input type="text" name="nin_no" class="p-1 border rounded" required>
                        </div>
                    </div>
                </div>

                <!-- 2. Address -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Address</h3>
                    <div class="space-y-2">
                        <h4 class="text-xl font-medium">Present Address</h4>
                        <div class="custom-grid">
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Village</label>
                                <input type="text" name="present_village" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Ward/Parish</label>
                                <input type="text" name="present_ward" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Sub-county</label>
                                <input type="text" name="present_subcounty" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">County</label>
                                <input type="text" name="present_county" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">District</label>
                                <input type="text" name="present_district" class="p-1 border rounded">
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <h4 class="text-xl font-medium">Permanent Address</h4>
                        <div class="custom-grid">
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Village</label>
                                <input type="text" name="permanent_village" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Ward/Parish</label>
                                <input type="text" name="permanent_ward" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Sub-county</label>
                                <input type="text" name="permanent_subcounty" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">County</label>
                                <input type="text" name="permanent_county" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">District</label>
                                <input type="text" name="permanent_district" class="p-1 border rounded">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. Contacts -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Contacts</h3>
                    <div id="telephoneContainer" class="space-y-1">
                        <div class="flex-container">
                            <input type="tel" name="telephone[]" class="p-1 border rounded min-w-0" placeholder="Telephone">
                            <button type="button" class="addTelephone bg-blue-500 text-white px-2 py-1 rounded">Add</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-lg font-medium">Email</label>
                        <input type="email" name="email" class="p-1 border rounded">
                    </div>
                </div>

                <!-- 4. Particulars of Age and Birth -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Age and Birth</h3>
                    <div class="custom-grid">
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Date of Birth (DD/MM/YYYY)</label>
                            <input type="text" name="dob" class="p-1 border rounded" placeholder="DD/MM/YYYY" pattern="\d{2}/\d{2}/\d{4}" required>
                        </div>
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Nationality</label>
                            <input type="text" name="nationality" class="p-1 border rounded">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <h4 class="text-xl font-medium">Place of Birth</h4>
                        <div class="custom-grid">
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Village</label>
                                <input type="text" name="birth_village" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Ward/Parish</label>
                                <input type="text" name="birth_ward" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">Sub-county</label>
                                <input type="text" name="birth_subcounty" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">County</label>
                                <input type="text" name="birth_county" class="p-1 border rounded">
                            </div>
                            <div class="min-w-0">
                                <label class="block text-lg font-medium">District</label>
                                <input type="text" name="birth_district" class="p-1 border rounded">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 5. Other Particulars -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Other Particulars</h3>
                    <div>
                        <label class="block text-lg font-medium">Marital Status</label>
                        <div class="flex flex-wrap gap-2">
                            <label class="text-lg"><input type="radio" name="marital_status" value="Single" required> Single</label>
                            <label class="text-lg"><input type="radio" name="marital_status" value="Married"> Married</label>
                            <label class="text-lg"><input type="radio" name="marital_status" value="Divorced"> Divorced</label>
                            <label class="text-lg"><input type="radio" name="marital_status" value="Widowed"> Widowed</label>
                        </div>
                    </div>
                    <div class="custom-grid">
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Spouse Name</label>
                            <input type="text" name="spouse_name" class="p-1 border rounded">
                        </div>
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Spouse NIN No</label>
                            <input type="text" name="spouse_nin" class="p-1 border rounded">
                        </div>
                    </div>
                    <div class="custom-grid">
                        <div class="min-w-0">
                            <label class=" personally identifiable information should not be shared in user prompts or in model responses without explicit consent from the individual to whom the information pertains. Next of Kin</label>
                            <input type="text" name="next_of_kin" class="p-1 border rounded">
                        </div>
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Next of Kin NIN No</label>
                            <input type="text" name="next_of_kin_nin" class="p-1 border rounded">
                        </div>
                    </div>
                </div>

                <!-- 6. Parental Status -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Parental Status</h3>
                    <div class="custom-grid">
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Father’s Name</label>
                            <input type="text" name="father_name" class="p-1 border rounded">
                        </div>
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Mother’s Name</label>
                            <input type="text" name="mother_name" class="p-1 border rounded">
                        </div>
                    </div>
                </div>

                <!-- 7. Biological Children -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Children</h3>
                    <div id="childrenContainer" class="space-y-1">
                        <div class="flex-container">
                            <input type="text" name="children[]" class="p-1 border rounded min-w-0" placeholder="Child’s Name">
                            <button type="button" class="addChild bg-blue-500 text-white px-2 py-1 rounded">Add</button>
                        </div>
                    </div>
                </div>

                <!-- 8. Occupation -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Occupation</h3>
                    <textarea name="occupation" class="p-1 border rounded" rows="3"></textarea>
                </div>

                <!-- Declaration -->
                <div class="space-y-2">
                    <h3 class="text-2xl font-semibold">Declaration</h3>
                    <p class="text-lg">I declare all particulars are true to my knowledge.</p>
                    <div class="custom-grid">
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Signature</label>
                            <input type="text" name="signature" class="p-1 border rounded" required>
                        </div>
                        <div class="min-w-0">
                            <label class="block text-lg font-medium">Date</label>
                            <input type="date" name="declaration_date" class="p-1 border rounded" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 text-lg">Submit</button>
            </form>
        </div>

        <!-- Retrieved Data -->
        <div class="bg-white p-4 rounded-lg shadow-md">
            <h2 class="text-3xl font-bold mb-3">Retrieved Data</h2>
            <button id="loadData" class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600 mb-3 text-lg">Load Data</button>
            <div id="dataContainer" class="space-y-4"></div>
        </div>
    </div>

    <script>
        // Google Apps Script Web App URL
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL';

        // Google Sheets API Configuration
        const CLIENT_ID = 'YOUR_GOOGLE_CLOUD_CLIENT_ID';
        const API_KEY = 'YOUR_GOOGLE_API_KEY';
        const SPREADSHEET_ID = 'YOUR_SPREADSHEET_ID';
        const RANGE = 'Sheet1!A1:AA';

        // Dynamic Telephone Fields
        document.querySelectorAll('.addTelephone').forEach(button => {
            button.addEventListener('click', () => {
                const container = button.parentElement.parentElement;
                const newField = document.createElement('div');
                newField.className = 'flex-container';
                newField.innerHTML = `
                    <input type="tel" name="telephone[]" class="p-1 border rounded min-w-0" placeholder="Telephone">
                    <button type="button" class="removeTelephone bg-red-500 text-white px-2 py-1 rounded">Remove</button>
                `;
                container.appendChild(newField);
                newField.querySelector('.removeTelephone').addEventListener('click', () => newField.remove());
            });
        });

        // Dynamic Children Fields
        document.querySelectorAll('.addChild').forEach(button => {
            button.addEventListener('click', () => {
                const container = button.parentElement.parentElement;
                const newField = document.createElement('div');
                newField.className = 'flex-container';
                newField.innerHTML = `
                    <input type="text" name="children[]" class="p-1 border rounded min-w-0" placeholder="Child’s Name">
                    <button type="button" class="removeChild bg-red-500 text-white px-2 py-1 rounded">Remove</button>
                `;
                container.appendChild(newField);
                newField.querySelector('.removeChild').addEventListener('click', () => newField.remove());
            });
        });

        // Handle Form Submission
        document.getElementById('bioDataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                full_name: formData.get('full_name'),
                nin_no: formData.get('nin_no'),
                present_village: formData.get('present_village'),
                present_ward: formData.get('present_ward'),
                present_subcounty: formData.get('present_subcounty'),
                present_county: formData.get('present_county'),
                present_district: formData.get('present_district'),
                permanent_village: formData.get('permanent_village'),
                permanent_ward: formData.get('permanent_ward'),
                permanent_subcounty: formData.get('permanent_subcounty'),
                permanent_county: formData.get('permanent_county'),
                permanent_district: formData.get('permanent_district'),
                telephone: formData.getAll('telephone[]').join(', '),
                email: formData.get('email'),
                dob: formData.get('dob'),
                nationality: formData.get('nationality'),
                birth_village: formData.get('birth_village'),
                birth_ward: formData.get('birth_ward'),
                birth_subcounty: formData.get('birth_subcounty'),
                birth_county: formData.get('birth_county'),
                birth_district: formData.get('birth_district'),
                marital_status: formData.get('marital_status'),
                spouse_name: formData.get('spouse_name'),
                spouse_nin: formData.get('spouse_nin'),
                next_of_kin: formData.get('next_of_kin'),
                next_of_kin_nin: formData.get('next_of_kin_nin'),
                father_name: formData.get('father_name'),
                mother_name: formData.get('mother_name'),
                children: formData.getAll('children[]').join(', '),
                occupation: formData.get('occupation'),
                signature: formData.get('signature'),
                declaration_date: formData.get('declaration_date')
            };

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbyavHqrnTLw3onFImiXqwhq7fPe9_xDCF7fxx2HT5LImSxxnsfsxhhYvxBnQ0a4uxB4/exec', {
                    method: 'POST',
                    body: JSON.stringify(data),
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    alert('Data submitted successfully!');
                    e.target.reset();
                } else {
                    alert('Error submitting data.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error submitting data.');
            }
        });

        // Initialize Google API Client
        function initClient() {
            gapi.client.init({
                apiKey: API_KEY,
                clientId: CLIENT_ID,
                discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
                scope: 'https://www.googleapis.com/auth/spreadsheets.readonly'
            }).then(() => {
                document.getElementById('loadData').addEventListener('click', loadData);
            }).catch((error) => {
                console.error('Error initializing API:', error);
            });
        }

        // Load Data from Google Sheet
        async function loadData() {
            try {
                const response = await gapi.client.sheets.spreadsheets.values.get({
                    spreadsheetId: 'YOUR_SPREADSHEET_ID',
                    range: RANGE
                });
                const rows = response.result.values;
                const container = document.getElementById('dataContainer');
                container.innerHTML = '';

                if (rows.length > 1) {
                    rows.slice(1).forEach((row, index) => {
                        const formHtml = `
                            <div class="border p-2 rounded bg-gray-50">
                                <h3 class="text-2xl font-semibold mb-1">Entry ${index + 1}</h3>

                                    <div class="custom-grid">
                                        <div class="min-w-0">
                                            <label class="block text-lg font-medium">Full Name</label>
                                            <input type="text" value="${row[0] || ''}" class="p-1 border rounded" readonly>
                                        </div>
                                        <div class="min-w-0">
                                            <label class="block text-lg font-medium">NIN No</label>
                                            <input type="text" value="${row[1] || ''}" class="p-1 border rounded" readonly>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 class="text-xl font-medium">Present Address</h4>
                                        <div class="custom-grid">
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Village</label>
                                                <input type="text" value="${row[2] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Ward/Parish</label>
                                                <input type="text" value="${row[3] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Sub-county</label>
                                                <input type="text" value="${row[4] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">County</label>
                                                <input type="text" value="${row[5] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">District</label>
                                                <input type="text" value="${row[6] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 class="text-xl font-medium">Permanent Address</h4>
                                        <div class="custom-grid">
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Village</label>
                                                <input type="text" value="${row[7] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Ward/Parish</label>
                                                <input type="text" value="${row[8] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Sub-county</label>
                                                <input type="text" value="${row[9] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">County</label>
                                                <input type="text" value="${row[10] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">District</label>
                                                <input type="text" value="${row[11] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-lg font-medium">Telephone</label>
                                        <input type="text" value="${row[12] || ''}" class="p-1 border rounded" readonly>
                                    </div>
                                    <div>
                                        <label class="block text-lg font-medium">Email</label>
                                        <input type="email" value="${row[13] || ''}" class="p-1 border rounded" readonly>
                                    </div>
                                    <div>
                                        <label class="block text-lg font-medium">Date of Birth</label>
                                        <input type="text" value="${row[14] || ''}" class="p-1 border rounded" readonly>
                                    </div>
                                    <div>
                                        <label class="block text-lg font-medium">Nationality</label>
                                        <input type="text" value="${row[15] || ''}" class="p-1 border rounded" readonly>
                                    </div>
                                    <div>
                                        <h4 class="text-xl font-medium">Place of Birth</h4>
                                        <div class="custom-grid">
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Village</label>
                                                <input type="text" value="${row[16] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Ward/Parish</label>
                                                <input type="text" value="${row[17] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">Sub-county</label>
                                                <input type="text" value="${row[18] || ''}" class="p-1 border rounded" readonly>
                                            </div>
                                            <div class="min-w-0">
                                                <label class="block text-lg font-medium">County</label>
                                                <input type="text" value="${row[19] || ''}" class="p-1 border rounded" readonly>
