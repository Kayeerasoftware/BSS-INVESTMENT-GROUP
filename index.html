<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSS C15 System</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
    }

    /* Floating background bubbles */
    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -100px;
      border-radius: 50%;
      opacity: 0.07;
      background: #38bdf8;
      animation: rise linear infinite;
    }
    .bubble:nth-child(1)  { width:40px;  height:40px;  left:10%;  animation-duration:8s;  animation-delay:0s;  }
    .bubble:nth-child(2)  { width:20px;  height:20px;  left:25%;  animation-duration:6s;  animation-delay:1s;  }
    .bubble:nth-child(3)  { width:60px;  height:60px;  left:50%;  animation-duration:10s; animation-delay:2s;  }
    .bubble:nth-child(4)  { width:30px;  height:30px;  left:70%;  animation-duration:7s;  animation-delay:0.5s;}
    .bubble:nth-child(5)  { width:50px;  height:50px;  left:85%;  animation-duration:9s;  animation-delay:3s;  }
    @keyframes rise {
      0%   { transform: translateY(0) scale(1);   opacity:0.07; }
      50%  { opacity:0.12; }
      100% { transform: translateY(-110vh) scale(1.2); opacity:0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 48px 44px 44px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: cardIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(40px) scale(0.9); }
      to   { opacity:1; transform: translateY(0)   scale(1);   }
    }

    /* Badge */
    .badge {
      display: inline-block;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 99px;
      margin-bottom: 20px;
    }

    /* Emoji */
    .emoji-wrap {
      margin-bottom: 6px;
      line-height: 1;
    }
    .big-emoji {
      font-size: 88px;
      display: inline-block;
      animation: bounce 1.4s ease-in-out infinite, spin-smile 6s linear infinite;
      filter: drop-shadow(0 8px 24px rgba(251,191,36,0.5));
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0)   scale(1);    }
      30%       { transform: translateY(-18px) scale(1.08); }
      60%       { transform: translateY(-6px)  scale(0.97); }
    }
    @keyframes spin-smile {
      0%,85%    { transform: rotate(0deg);  }
      90%       { transform: rotate(-15deg);}
      95%       { transform: rotate(15deg); }
      100%      { transform: rotate(0deg);  }
    }

    /* Animated pointer arrow */
    .arrow-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 8px;
    }
    .arrow {
      font-size: 32px;
      animation: point 0.8s ease-in-out infinite alternate;
      display: inline-block;
    }
    @keyframes point {
      from { transform: translateX(0);    opacity: 0.7; }
      to   { transform: translateX(10px); opacity: 1;   }
    }
    .arrow-label {
      font-family: 'Fredoka One', cursive;
      font-size: 18px;
      color: #fde68a;
      letter-spacing: 0.5px;
    }

    /* Headline */
    h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 22px;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 8px;
    }
    h1 span {
      background: linear-gradient(90deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 28px;
    }

    /* CTA Button */
    .cta {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: 19px;
      padding: 16px 36px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(56,189,248,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      pointer-events: none;
    }
    .cta:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 18px 50px rgba(56,189,248,0.55);
    }
    .cta:active {
      transform: translateY(0) scale(0.98);
    }

    /* Pulse ring around button */
    .cta-wrap {
      position: relative;
      display: inline-block;
    }
    .pulse-ring {
      position: absolute;
      inset: -6px;
      border-radius: 22px;
      border: 2px solid rgba(56,189,248,0.5);
      animation: pulse-ring 2s ease-out infinite;
    }
    @keyframes pulse-ring {
      0%   { transform: scale(1);    opacity:0.7; }
      100% { transform: scale(1.15); opacity:0;   }
    }

    /* Footer credit */
    .credit {
      margin-top: 28px;
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Background bubbles -->
  <div class="bubbles">
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div><div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <div class="card">
    <div class="badge">🎓 BSS Alumni Portal</div>

    <div class="emoji-wrap">
      <span class="big-emoji">😁</span>
    </div>

    <div class="arrow-row">
      <span class="arrow">👇</span>
      <span class="arrow-label">Click here to visit the</span>
      <span class="arrow">👇</span>
    </div>

    <h1>Incredible <span>BSS C15 System</span></h1>
    <p class="sub">Bunya Secondary School Alumni · Investment Group</p>

    <div class="cta-wrap">
      <div class="pulse-ring"></div>
      <a class="cta" href="https://bss-c15-investment-system.onrender.com" target="_blank" rel="noopener">
        🚀 Visit the System
      </a>
    </div>

    <p class="credit">© 2025 KAYEERA NATHAN @ Software</p>
  </div>

</body>
</html>
